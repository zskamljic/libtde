name: Release

# A version tag builds the program as the Arch packages do and attaches it to the tag's GitHub
# release, for the -bin packages to install.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: >
          pacman -Syu --noconfirm --needed
          gcc pkgconf cmake ninja git zstd qt6-base qt6-svg lua shared-mime-info
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          DESTDIR="$PWD/pkg" cmake --install build
          tar --zstd -C pkg -cf "libtde-${GITHUB_REF_NAME#v}-x86_64.tar.zst" .
      - uses: softprops/action-gh-release@v2
        with:
          files: libtde-*-x86_64.tar.zst
